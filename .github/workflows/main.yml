on:
  - push
  - workflow_dispatch

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan_project_job:
    runs-on: ubuntu-latest
    name: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report-normalized-compact.sarif.json
